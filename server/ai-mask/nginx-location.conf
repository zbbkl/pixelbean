# 插入到 /etc/nginx/sites-available/<含 /pixelbean/ 的 server 块> 中，
# **必须放在 `location /pixelbean/` 之前**（nginx 取最长前缀匹配，/pixelbean/api/ 已更长，但放在前面可读性更好）。
# 改完务必：nginx -t && systemctl reload nginx
    # PixelBean 服务端 AI 抠图（仅本机常驻服务 8790，不对外暴露）
    location /pixelbean/api/ {
        proxy_pass http://127.0.0.1:8790/;
        proxy_http_version 1.1;
        client_max_body_size 8m;      # 1024² RGBA = 4MB，留 2 倍余量
        proxy_read_timeout 120s;      # 2 核机器单张推理可达数秒，留足余量
        proxy_send_timeout 120s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
